name: Release

on:
  push:
    tags: ['v*']

# Least privilege: `contents: write` only for creating the GitHub Release,
# `id-token: write` for npm Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.
      - name: Ensure a trusted-publishing-capable npm
        run: npm install --global npm@latest

      - run: npm ci --include=dev

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi

      - name: Refuse to republish an existing version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "nestjs-meta-capi@$VERSION" version >/dev/null 2>&1; then
            echo "::error::nestjs-meta-capi@$VERSION is already published."
            exit 1
          fi

      # Re-run the full validation chain so a tag can never publish untested code.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - run: npm run pack:check

      # OIDC Trusted Publishing generates provenance automatically — do not add
      # a long-lived NPM_TOKEN, and do not hand-add a --provenance flag.
      #
      # NOTE: trusted publishing generally cannot create a *brand-new* package
      # name. Perform the initial publish once out-of-band (or configure a
      # pending trusted publisher on npm) before relying on this workflow.
      # Trusted publishing uses the OIDC token from `id-token: write`. The npm
      # error is surfaced as a check annotation because annotations are readable
      # without repository access, unlike step logs.
      - name: Publish via Trusted Publishing
        run: |
          set +e
          npm publish --access public > /tmp/publish.log 2>&1
          status=$?
          cat /tmp/publish.log
          if [ "$status" -ne 0 ]; then
            npmrc="(no ~/.npmrc)"
            if [ -f "$HOME/.npmrc" ]; then
              npmrc=$(sed -E 's/(_authToken=).*/\1<redacted>/' "$HOME/.npmrc" | tr '\n' '; ')
            fi
            oidc="no"
            [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && oidc="yes"
            reason=$(grep -iE '^npm (error|notice)' /tmp/publish.log | head -8 | tr '\n' '; ')
            detail="npm=$(npm --version) node=$(node --version) oidc-env=${oidc} npmrc=${npmrc} :: ${reason}"
            detail=$(printf '%s' "$detail" | sed 's/%/%25/g' | tr -d '\r')
            echo "::error title=npm publish failed::${detail}"
            exit "$status"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
