name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --include=dev guards against an inherited NODE_ENV=production, which
      # would otherwise make npm skip devDependencies.
      - run: npm ci --include=dev

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - run: npm run pack:check

  nestjs-compat:
    name: NestJS 11 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --include=dev

      # Verify the package still compiles and behaves against the lowest
      # supported NestJS major.
      - name: Install NestJS 11
        run: |
          npm install --no-save \
            @nestjs/common@^11 \
            @nestjs/core@^11 \
            @nestjs/platform-express@^11 \
            @nestjs/platform-fastify@^11 \
            @nestjs/testing@^11

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
