version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # ts-jest and typescript-eslint do not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
